<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drum kit</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Creating the header container to show my id and my project -->
    <header class="header-container">
        <div class="name-logo">
            <img src="./images/eiliya-bni-github-profile.jpeg" alt="EILIYA-bni github profile picture" width="130">
            <h1>Drum Kit</h1>
        </div>

        <div class="links">
            <nav>
                <ul>
                    <li><a href="https://github.com/EILIYA-bni/">Github</a></li>
                    <li><a href="https://www.linkedin.com/in/eiliya-babakhani-7a5b7b442/">LinkedIn</a></li>
                    <li><a href="https://www.instagram.com/eiliya_bni/">Instagram</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <!-- Creating the keys container -->
        <div class="keysContainer">
            <!-- each key added with their data-key -->
            <div data-key="65" class="key">
                <kbd>A</kbd>
                <!-- The 'A' key sound 'Clap' -->
                <span class="sound">CLAP</span>
            </div>

            <div data-key="83" class="key">
                <kbd>S</kbd>
                <span class="sound">HIHAT</span>
            </div>

            <div data-key="68" class="key">
                <kbd>D</kbd>
                <span class="sound">KICK</span>
            </div>

            <div data-key="70" class="key">
                <kbd>F</kbd>
                <span class="sound">OPENHAT</span>
            </div>

            <div data-key="71" class="key">
                <kbd>G</kbd>
                <span class="sound">BOOM</span>
            </div>

            <div data-key="72" class="key">
                <kbd>H</kbd>
                <span class="sound">RIDE</span>
            </div>

            <div data-key="74" class="key">
                <kbd>J</kbd>
                <span class="sound">SNARE</span>
            </div>

            <div data-key="75" class="key">
                <kbd>K</kbd>
                <span class="sound">TOM</span>
            </div>

            <div data-key="76" class="key">
                <kbd>L</kbd>
                <span class="sound">TINK</span>
            </div>

            <audio data-key="65" src="sounds/clap.wav"></audio>
            <audio data-key="83" src="sounds/hihat.wav"></audio>
            <audio data-key="68" src="sounds/kick.wav"></audio>
            <audio data-key="70" src="sounds/openhat.wav"></audio>
            <audio data-key="71" src="sounds/boom.wav"></audio>
            <audio data-key="72" src="sounds/ride.wav"></audio>
            <audio data-key="74" src="sounds/snare.wav"></audio>
            <audio data-key="75" src="sounds/tom.wav"></audio>
            <audio data-key="76" src="sounds/tink.wav"></audio>
        </div>

        <!-- Starting the Javascript coding linked to script.js -->
        <script src="script.js"></script>
    </main>
</body>

</html>
