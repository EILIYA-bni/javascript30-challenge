<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS and CSS Clock</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <!-- Using the div to be the main container -->
    <div class="page-container">
        <!-- Header Section -->
        <header class="header-container">
            <div class="name-logo">
                <img src="https://avatars.githubusercontent.com/u/166543276?v=4" alt="EILIYA-bni github profile picture"
                    width="130">
                <h1>JS and CSS Clock</h1>
            </div>

            <div class="links">
                <nav>
                    <ul>
                        <li><a href="https://github.com/EILIYA-bni/">Github</a></li>
                        <li><a href="https://www.linkedin.com/in/eiliya-babakhani-7a5b7b442/">LinkedIn</a></li>
                        <li><a href="https://www.instagram.com/eiliya_bni/">Instagram</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <!-- Editorial introduction -->
        <div class="editorial-introduction">
            <h2>CHRONOS</h2>
            <span>INSTRUMENT NO.02</span>
        </div>

        <!-- Main Section -->
        <main class="main-content">
            <section class="introduction">
                <!-- Heading and description -->
                <span class="eyebrow">A STUDY OF TIME</span>

                <h1>
                    TIME,<br>
                    MADE<br>
                    VISIBLE<span>.</span>
                </h1>

                <p>
                    Precision in every second.
                    A minimal instrument for measuring the present.
                </p>
            </section>

            <!-- Analog Clock -->
            <section class="clock-section">
                <div class="clock-face">

                    <!-- Clock numbers -->
                    <span class="clock-number twelve">12</span>
                    <span class="clock-number three">3</span>
                    <span class="clock-number six">6</span>
                    <span class="clock-number nine">9</span>

                    <!-- Clock hands -->
                    <div class="hand hour-hand"></div>
                    <div class="hand minute-hand"></div>
                    <div class="hand second-hand"></div>

                    <!-- Center point -->
                    <div class="clock-center"></div>
                </div>
            </section>
        </main>

        <!-- Digital information -->
        <footer class="information">
            <div class="time-information">
                <span>LOCAL TIME</span>
                <time datetime="digital-time">00:00:00</time>
            </div>

            <div class="date-information">
                <span>DATE</span>
                <time datetime="current-date">Loading...</time>
            </div>

            <div class="timezone-information">
                <span>TIMEZONE</span>
                <time datetime="timezone">Loading...</time>
            </div>
        </footer>
    </div>
</body>

</html>
